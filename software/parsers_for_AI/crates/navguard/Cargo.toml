[package]
name = "navguard"
version = "0.1.0"
edition = "2021"
description = "Project navigator and symbol index used by any_txt_parser"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
notify = "7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
# Local time with its offset for the navigators' Updated line.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3.27.0"
